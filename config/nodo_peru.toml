# Nodo de demostración: Perú (Lima) con cámara y montura simuladas.
# Para hardware real, parte de config/nodo_hardware_ejemplo.toml.

[node]
id = "peru"
name = "Perú"
server_url = "ws://localhost:8000/ws/node"
token = "demo-token-cambiar"
state_file = "estado_peru.json"

[site]
# Coordenadas aproximadas de Lima. Reemplazar por las del sitio real.
latitude = -12.0464
longitude = -77.0428
elevation_m = 150
utc_offset_hours = -5

[optics]
focal_length_mm = 300
aperture_mm = 90

[camera]
driver = "simulated"
width = 1280
height = 960
stream_width = 960
fps = 3
exposure_ms = 200
gain = 4

[camera.simulated]
clouds = 0.0
seeing_px = 1.3
light_pollution = 0.3
force_night = true    # cielo nocturno aunque sea de día (solo simulador)
seed = 2

[mount]
driver = "simulated"
type = "altaz"
min_altitude_deg = 10
max_slew_deg_s = 2.5
home_alt = 0
home_az = 180

[mount.simulated]
# Error de montaje "desconocido" para practicar la alineación desde la página.
error_alt_deg = 0.12
error_az_deg = -0.2

[analysis]
interval_s = 2.0
