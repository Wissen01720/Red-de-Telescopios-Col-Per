[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "red-telescopios"
version = "0.1.0"
description = "Red de telescopios Colombia–Perú: nodos Raspberry Pi y consola web sincronizada"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Raspberry Pi: además, por apt: python3-picamera2 python3-lgpio (usar venv con --system-site-packages)
node = ["opencv-python-headless>=4.8", "websockets>=13"]
lx200 = ["pyserial>=3.5"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "astropy>=6", "opencv-python-headless>=4.8", "websockets>=13",
       "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools.packages.find]
include = ["astrocore*", "telescope_node*", "control_server*"]

[tool.setuptools.package-data]
astrocore = ["data/*"]
control_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
